<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro de Vacas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Registro de Vacas</h1>

    <section class="card">
      <h2>Registrar Vaca</h2>
      <form id="form-registro">
        <label>Código:
          <input type="text" id="codigo" placeholder="Ej: C123 (opcional)">
        </label>
        <label>Fecha de nacimiento:
          <input type="date" id="fechaNacimiento" required>
        </label>
        <label>Peso (kg):
          <input type="number" id="peso" step="0.1" min="0" required>
        </label>
        <label>Raza:
          <select id="razaSelect"></select>
        </label>
        <div class="actions">
          <button type="submit">Registrar</button>
          <button type="button" id="btn-reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Razas</h2>
      <form id="form-raza">
        <label>Raza:
          <input type="text" id="razaNombre" required placeholder="Ej: Holstein">
        </label>
        <div class="actions">
          <button type="submit">Crear Raza</button>
        </div>
      </form>
      <small>Nota: crea la raza y luego pulsa "Entrar" para añadir hasta 3 rangos de edad.</small>

      <div id="razasList"></div>

      <div id="razaEditor" class="hidden">
        <h3 id="editorTitle">Editor de Raza</h3>
        <div id="editorRanges"></div>
        <form id="editorForm">
          <label>Edad mínima (años, decimales permitidos, p. ej. 1.5 = 1 año 6 meses):
            <input type="number" id="e_ageMin" step="0.1" min="0" value="0" required>
          </label>
          <label>Edad máxima (años, decimales permitidos):
            <input type="number" id="e_ageMax" step="0.1" min="0" value="999" required>
          </label>
          <label>Peso mínimo (kg):
            <input type="number" id="e_min" step="0.1" min="0" required>
          </label>
          <label>Peso máximo (kg):
            <input type="number" id="e_max" step="0.1" min="0" required>
          </label>
          <div class="actions">
            <button type="submit" id="btnAddRange">Agregar/Guardar rango</button>
            <button type="button" id="btnBack">Volver</button>
          </div>
        </form>
      </div>
    </section>

    <section class="card">
      <h2>Vacas Registradas</h2>
      <div id="vacasList"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
