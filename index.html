<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro de Vacas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Registro de Vacas</h1>

    <section class="card">
      <h2>Registrar Vaca</h2>
      <form id="form-registro">
        <label>Código:
          <input type="text" id="codigo" placeholder="Ej: C123 (opcional)">
        </label>
        <label>Fecha de nacimiento:
          <input type="date" id="fechaNacimiento" required>
        </label>
        <label>Peso (kg):
          <input type="number" id="peso" step="0.1" min="0" required>
        </label>
        <label>Sexo:
          <select id="sexoSelect" required>
            <option value="Macho">Macho</option>
            <option value="Hembra">Hembra</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit">Registrar</button>
          <button type="button" id="btn-reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Rangos Brahman</h2>
      <p class="section-note">Valores oficiales por edad, sexo y peso según la tabla entregada.</p>
      <div id="razasList"></div>
    </section>

    <section class="card">
      <h2>Vacas Registradas</h2>
      <div id="vacasList"></div>
    </section>
  </main>

  <script src="app.js?v=3"></script>
</body>
</html>
