<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de bovinos | Santa Bárbara</title>
  <link rel="stylesheet" href="styles.css?v=ranges-editor-1">
</head>
<body>
  <main>
    <h1>Registro de bovinos</h1>
    <section class="card">
      <h2>Registrar bovino</h2>
      <form id="form-registro">
        <label>Código
          <input type="text" id="codigo" required maxlength="30">
        </label>
        <label>Fecha de nacimiento
          <input type="date" id="fechaNacimiento" required>
        </label>
        <label>Peso (kg)
          <input type="number" id="peso" min="0.1" step="0.1" required>
        </label>
        <label>Sexo
          <select id="sexoSelect" required>
            <option value="">Seleccione</option>
            <option value="Macho">Macho</option>
            <option value="Hembra">Hembra</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit">Registrar</button>
          <button type="button" id="btn-reset" class="secondary">Limpiar</button>
        </div>
      </form>
    </section>
    <section class="card ranges-card">
      <div class="section-heading">
        <div>
          <h2>Rangos Brahman</h2>
          <p>Consulta, edita o elimina los rangos por sexo.</p>
        </div>
        <button type="button" id="btn-toggle-rangos" aria-expanded="false">Abrir rangos</button>
      </div>
      <div id="rangosPanel" class="hidden">
        <div id="rangoEditor" class="range-editor hidden">
          <div class="section-heading">
            <div>
              <h3 id="rangoEditorTitulo">Nuevo rango</h3>
              <p>Define el intervalo de edad y los pesos en kilogramos.</p>
            </div>
          </div>
          <form id="form-rango">
            <label>Sexo
              <select id="rangoSexo" required>
                <option value="Macho">Macho</option>
                <option value="Hembra">Hembra</option>
              </select>
            </label>
            <label>Edad desde (meses)
              <input type="number" id="rangoEdadMin" min="0" step="1" required>
            </label>
            <label>Edad hasta (meses)
              <input type="number" id="rangoEdadMax" min="0" step="1" required>
            </label>
            <label>Peso mínimo (kg)
              <input type="number" id="rangoPesoMin" min="0" step="0.1" required>
            </label>
            <label>Peso promedio (kg)
              <input type="number" id="rangoPesoPromedio" min="0" step="0.1" required>
            </label>
            <label>Peso máximo (kg)
              <input type="number" id="rangoPesoMax" min="0" step="0.1" required>
            </label>
            <div class="actions">
              <button type="submit">Guardar rango</button>
              <button type="button" id="btn-cancelar-rango" class="secondary">Cancelar</button>
            </div>
          </form>
        </div>
        <div id="razasList"></div>
      </div>
    </section>
    <section class="card">
      <h2>Bovinos registrados</h2>
      <label class="search-field">Buscar por código
        <input type="search" id="buscarCodigo" placeholder="Código del bovino">
      </label>
      <div id="vacasList"></div>
    </section>
  </main>
  <script src="app.js?v=ranges-editor-1"></script>
</body>
</html>
